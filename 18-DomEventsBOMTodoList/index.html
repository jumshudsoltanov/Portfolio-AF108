    <div class="container mt-5">
      <h1 class="text-center mb-4 fw-bold">📝 Todo List</h1>
      <div class="todo-app mx-auto">
        <input
          type="text"
          id="todo-input"
          class="form-control mb-3"
          placeholder="Add a new task..."
        />
        <button id="add-todo" class="btn btn-primary w-100 mb-3">
          Add to List
        </button>
        <ul id="todo-list" class="list-group"></ul>

        <div class="text-center mt-4">
          <button id="clear-todos" class="btn btn-danger w-100">
            Clear All Tasks
          </button>
        </div>
      </div>
    </div>
