<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-4 d-flex justify-content-between">
    <span class="navbar-brand">Salam, <span id="displayUsername">İstifadəçi</span></span>
    <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#settingsModal">
      ⚙ Ayarlar
    </button>
  </nav>

  <div class="container mt-5">
    <h2>Home Page Məzmunu Burada</h2>
    <p>Bura ana səhifənin əsas məzmunu yerləşdirilə bilər.</p>
  </div>

  <!-- Ayarlar Modal -->
  <div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="settingsForm">
          <div class="modal-header">
            <h5 class="modal-title">Ayarlar</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="newUsername" class="form-label">Yeni Ad</label>
              <input type="text" class="form-control" id="newUsername" required />
            </div>
            <div class="mb-3">
              <label for="newEmail" class="form-label">Yeni Email</label>
              <input type="email" class="form-control" id="newEmail" required />
            </div>
            <div class="mb-3">
              <label for="newPassword" class="form-label">Yeni Şifrə</label>
              <input type="password" class="form-control" id="newPassword" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Yadda saxla</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/Js/home.js""></script>
</body>
</html>
