<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/Css/style.css" />
  </head>
  <body>
    <div class="login-box">
      <h2>Sign Up</h2>
      <form>
        <input
        id="username"
          type="text"
          placeholder="Username"
          required
          minlength="3"
          maxlength="20"
        />
        <input id="email" type="email" placeholder="Email" required  />
        <input id="password" type="password" placeholder="Password" required min="8" max="64"/>
        <input id="passwordRepeat"  type="password" placeholder="Password Repeat" required />
        <button id="btnRegister" type="submit">Register</button>
      </form>
      <p class="link-text">
        I already have an account. <a href="login.html">Sign In</a>
      </p>
    </div>
    <!--! Register Script -->
    <script src="./assets/Js/register.js"></script>
  </body>
</html>
